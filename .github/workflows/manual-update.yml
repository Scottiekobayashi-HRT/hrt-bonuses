name: Manual Bonus Update

on:
  workflow_dispatch:

jobs:
  manual-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Write bonuses.json
        run: python seed_bonuses.py

      - name: Commit bonuses.json
        run: |
          git config user.name "HRT Bot"
          git config user.email "bot@hawaiirewardtravel.com"
          git add bonuses.json
          git commit -m "Manual bonus update $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
